# 根目录 wrangler 配置——供 Cloudflare Workers Builds（Git 推送自动构建）使用。
# 仓库根目录没有 wrangler 配置时，自动构建会把整个仓库当静态资源部署，
# 导致 /api/* 全部 404。有了这个文件，推送触发的构建会部署真正的 Worker 代码。
# 密钥不在文件里（Worker secret 随脚本保留，任何来源的新版本都会继承）。
name = "yangmao-aihub"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"

[vars]
LLM_BASE_URL = "https://api.siliconflow.cn/v1"
LLM_MODEL = "Qwen/Qwen2.5-7B-Instruct"
# AI 分级用模：复杂需求（凑单/比价/多轮规划）自动切到更强模型
LLM_MODEL_SMART = "deepseek-ai/DeepSeek-V4.1-Flash"
# 接口健康监控 + 邮件告警（SMTP_PASS 授权码是密钥，用 wrangler secret put 单独配）
SMTP_HOST = "smtp.qq.com"
SMTP_PORT = "465"
SMTP_USER = "370542303@qq.com"
SMTP_FROM = "370542303@qq.com"
ALERT_MAIL_TO = "370542303@qq.com"
ALERT_TOKEN = "woolalert-20261016"

# ---- 渠道标识 + 自有账号固定推广链接 ----
# 渠道标识 = 好单库后台「点立即推广」里填的那个值（本地生活会场转链会带上它）
HDK_CHANNEL = "yangmao"
# 好单库开放平台的京东转链只认「官方账号」；自有账号的推广链接请在好单库后台
# 「立即推广 → 渠道标识 yangmao」生成后粘贴到下面。留空则该平台走默认通道/直达入口。
# 京东双11主会场（密令「限时福利295」，备选「最佳手气王202」）
LINK_JD_MAIN = "https://pro.m.jd.com/mall/active/4Gks5dMEpjonE5XYzAG1jG2mMM9R/index.html"
# 京享红包（口令同主会场：京东搜「限时福利295」）
LINK_JD_RED = "https://u.jd.com/FD5LeHX"
# 京东外卖专场（密令「餐补来了5930」）
LINK_JD_WM = "https://u.jd.com/FDmpEF9"
# 京东领券中心（密令「领券加码1050」）
LINK_JD_COUPON = "https://u.jd.com/Fam7eZt"
LINK_PDD = ""
LINK_DY = "https://z.douyin.com/JImh7NBm"
# 京享红包口令（首页红包卡上可一键复制，去京东 APP 搜索领取）
JD_RED_WORD = "限时福利295"

# ---- 京东联盟官方通道（自有账号直连 api.jd.com，彻底绕开好单库）----
# 京东联盟的开放网关是公开的：用自己的 appKey / secretKey / siteId 就能转「任意」京东
# 链接（商品页、会场、u.jd.com 短链都吃），佣金 100% 归自己 ——
# 也就是 union.jd.com 里那个「万能转链」，只是现在由 Worker 自动完成，不用手动一条条转。
# 三个值配齐后，京东会场、京东实时线报里点「转我的链接」全部走这条官方通道。
# ⚠️ 本仓库是公开仓库（GitHub Pages 就是从它发布的），secretKey 绝不能写进这个文件，
#    JD_APP_SECRET 请在 Cloudflare 后台配成 Secret —— 见文件末尾「密钥配置」。
JD_APP_KEY = "8031b78d1ff40fdfc7986509d5fc2cd9"
# 网站验证文件 jd_root.txt 已放仓库根目录（https://chenking-maker.github.io/yangmao-aihub/jd_root.txt）
JD_SITE_ID = "4109205570"          # 「网站ID」（union.jd.com → 推广管理 → 网站管理，已通过验证）
# 京东联盟ID（账户管理里可见）：转链时带上，按账号归因更稳
JD_UNION_ID = "1000559363"
# JD_APP_SECRET 不在此处写（见文末「密钥配置」）
# 可选：子推广位（渠道标识，用来区分流量来源）
JD_SUB_UNION_ID = "yangmao"
# 可选：有的账号走 PID 而不是 siteId，填了就优先用
JD_PID = ""
# 可选：京东联盟 OAuth 拿到的 access_token（部分账号调用转链接口需要）
JD_ACCESS_TOKEN = ""
# 省钱日报的微信推送通道：PushPlus（个人微信扫码免费拿 token，填到 PUSH_TOKEN）
# 或企业微信群机器人 webhook（填到 WECOM_WEBHOOK）。两个都不填则只生成日报、不推送。
# 注意：接口异常告警也支持走这两个通道（没配 SMTP 授权码时的兜底）。

# ============================ 密钥配置（已配好在 Cloudflare 加密侧） ============================
# 仓库是公开的，所以「密钥」一律不写进文件，只存在 Cloudflare 后台。需要更换时：
#   ① 打开 https://dash.cloudflare.com → Workers & Pages → yangmao-aihub
#   ② Settings（设置）→ Variables and Secrets（变量和密钥）→ Add
#   ③ 类型选 **Secret**（不是 Text/Plaintext），名字必须完全一致：
#        JD_APP_SECRET = 京东联盟应用的 secretKey（union.jd.com/myTools/myApi）
#        SMTP_PASS     = QQ 邮箱授权码（mail.qq.com → 设置 → 账号 → 生成授权码，不是登录密码）
#   ④ 保存即生效；以后每次 git push 构建都会自动继承，不需要重传。
# 自检：访问 /api/health?deep=1，看「京东联盟官方转链」和「省钱日报 · 推送通道」两行状态。

# 定时任务：
#  ① 每天 08:00（北京时间）= 生成「省钱日报」并推送微信
#  ② 每 30 分钟 = 全链路体检（异常发邮件）+ 重接口缓存预热
[triggers]
crons = ["0 0 * * *", "*/30 * * * *"]
