# 根目录 wrangler 配置——供 Cloudflare Workers Builds（Git 推送自动构建）使用。
# 仓库根目录没有 wrangler 配置时，自动构建会把整个仓库当静态资源部署，
# 导致 /api/* 全部 404。有了这个文件，推送触发的构建会部署真正的 Worker 代码。
# 密钥不在文件里（Worker secret 随脚本保留，任何来源的新版本都会继承）。
name = "yangmao-aihub"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"

[vars]
LLM_BASE_URL = "https://api.siliconflow.cn/v1"
LLM_MODEL = "Qwen/Qwen2.5-7B-Instruct"
# AI 分级用模：复杂需求（凑单/比价/多轮规划）自动切到更强模型
LLM_MODEL_SMART = "deepseek-ai/DeepSeek-V4.1-Flash"
# 接口健康监控 + 邮件告警（SMTP_PASS 授权码是密钥，用 wrangler secret put 单独配）
SMTP_HOST = "smtp.qq.com"
SMTP_PORT = "465"
SMTP_USER = "370542303@qq.com"
SMTP_FROM = "370542303@qq.com"
ALERT_MAIL_TO = "370542303@qq.com"
ALERT_TOKEN = "woolalert-20261016"
# 省钱日报的微信推送通道：PushPlus（个人微信扫码免费拿 token，填到 PUSH_TOKEN）
# 或企业微信群机器人 webhook（填到 WECOM_WEBHOOK）。两个都不填则只生成日报、不推送。

# 定时任务：
#  ① 每天 08:00（北京时间）= 生成「省钱日报」并推送微信
#  ② 每 30 分钟 = 全链路体检（异常发邮件）+ 重接口缓存预热
[triggers]
crons = ["0 0 * * *", "*/30 * * * *"]
