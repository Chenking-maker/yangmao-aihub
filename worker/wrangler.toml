name = "yangmao-aihub"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 部署命令（在 worker 目录下执行）：npx wrangler deploy
# 密钥一律用命令设置，不要写进这个文件：
#   npx wrangler secret put HDK_APIKEY
#   npx wrangler secret put HDK_PID
#   npx wrangler secret put HDK_TB_NAME
#   npx wrangler secret put JD_UNION_ID
#   npx wrangler secret put LLM_API_KEY
# 本地开发用 tools/.env（不进 Git）

[vars]
LLM_BASE_URL = "https://api.siliconflow.cn/v1"
LLM_MODEL = "Qwen/Qwen2.5-7B-Instruct"
# AI 分级用模：复杂需求（凑单/比价/多轮规划）自动切到更强模型
LLM_MODEL_SMART = "deepseek-ai/DeepSeek-V4.1-Flash"

# 接口健康监控：每 30 分钟自检一次，异常发邮件告警
[triggers]
crons = ["*/30 * * * *"]
