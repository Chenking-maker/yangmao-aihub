name = "yangmao-aihub"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 部署命令（在 worker 目录下执行）：npx wrangler deploy
# 密钥一律用命令设置，不要写进这个文件：
#   npx wrangler secret put HDK_APIKEY
#   npx wrangler secret put HDK_PID
#   npx wrangler secret put HDK_TB_NAME
#   npx wrangler secret put JD_UNION_ID
#   npx wrangler secret put LLM_API_KEY
#   npx wrangler secret put SMTP_PASS      # QQ 邮箱授权码（告警发信用）
# 本地开发用 tools/.env（不进 Git）

[vars]
LLM_BASE_URL = "https://api.siliconflow.cn/v1"
LLM_MODEL = "Qwen/Qwen2.5-7B-Instruct"
# AI 分级用模：复杂需求（凑单/比价/多轮规划）自动切到更强模型
LLM_MODEL_SMART = "deepseek-ai/DeepSeek-V4.1-Flash"
# 接口健康监控 + 邮件告警（SMTP_PASS 授权码是密钥，用 wrangler secret put 单独配）
SMTP_HOST = "smtp.qq.com"
SMTP_PORT = "465"
SMTP_USER = "370542303@qq.com"
SMTP_FROM = "370542303@qq.com"
ALERT_MAIL_TO = "370542303@qq.com"
ALERT_TOKEN = "woolalert-20261016"
# 省钱日报的微信推送通道（PushPlus 的 PUSH_TOKEN / 企业微信机器人 WECOM_WEBHOOK）

# ---- 渠道标识 + 自有账号固定推广链接 ----
# 渠道标识 = 好单库后台「点立即推广」里填的那个值（本地生活会场转链会带上它）
HDK_CHANNEL = "yangmao"
# 好单库开放平台的京东转链只认「官方账号」；自有账号的推广链接请在好单库后台
# 「立即推广 → 渠道标识 yangmao」生成后粘贴到下面。留空则该平台走默认通道/直达入口。
LINK_JD_MAIN = ""
LINK_JD_RED = ""
LINK_JD_WM = ""
LINK_PDD = ""
LINK_DY = "https://z.douyin.com/JImh7NBm"

# 定时任务：
#  ① 每天 08:00（北京时间）= 生成「省钱日报」并推送微信
#  ② 每 30 分钟 = 全链路体检（异常发邮件）+ 重接口缓存预热
[triggers]
crons = ["0 0 * * *", "*/30 * * * *"]
