<body>

<header class="topnav" id="topnav"></header>

<div class="chat-page">

  <!-- 置顶红包条：聊天地也随时领 -->
  <div class="rp-pin" id="rpPin">
    <button class="rp-pin-card tb" id="pinTb">
      <span class="rp-pin-ico">🧧</span>
      <span class="rp-pin-body">
        <span class="rp-pin-name">淘宝超级红包</span>
        <span class="rp-pin-sub">每天可领 · 下单抵现</span>
      </span>
      <span class="rp-pin-go">领取 ›</span>
    </button>
    <button class="rp-pin-card jd" id="pinJd">
      <span class="rp-pin-ico">🎁</span>
      <span class="rp-pin-body">
        <span class="rp-pin-name">京享红包</span>
        <span class="rp-pin-sub">京东全品类 · 每天可领</span>
      </span>
      <span class="rp-pin-go">领取 ›</span>
    </button>
    <a class="rp-pin-card list" href="https://s.hd00.cn/SLwG" target="_blank" rel="noopener">
      <span class="rp-pin-ico">📋</span>
      <span class="rp-pin-body">
        <span class="rp-pin-name">双11 福利清单</span>
        <span class="rp-pin-sub">全网折扣好货 · 持续更新</span>
      </span>
      <span class="rp-pin-go">查看 ›</span>
    </a>
  </div>

  <!-- 对话面板 -->
  <section class="chat-panel chat-page-panel">
    <div class="chat-head">
      <a class="chat-back" href="index.html" title="返回首页">‹</a>
      <div class="chat-avatar">🐑</div>
      <div>
        <div class="t">羊毛AI · 找券助手</div>
        <div class="s">说想买啥，券和红包自己找上门</div>
      </div>
      <span class="spacer"></span>
      <span class="mode-chip" id="chatMode">AI 增强</span>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input">
      <div class="box">
        <input id="chatInput" type="text" placeholder="想买什么？也可以直接发淘宝/京东链接，AI 帮你转成优惠链接" autocomplete="off">
      </div>
      <button class="send-btn" id="chatSend" title="发送">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </section>

  <p class="chat-page-tip">找不到想说的？试试：「9.9 包邮有什么值得买」「满200减20怎么凑单」「把淘宝链接转成我的优惠链接」</p>
</div>
