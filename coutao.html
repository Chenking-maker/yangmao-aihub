<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凑单工具 · 羊毛AIHUB</title>
<meta name="description" content="输入你的产品，自动算差额、推荐刚好补差的商品。今年双11 淘宝以官方立减为主，跨店常见每满200减20。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%23d93832'/><g fill='%23ffffff'><circle cx='17' cy='20' r='6.5'/><circle cx='24' cy='18' r='6'/><circle cx='23' cy='25' r='5.5'/><circle cx='16' cy='26' r='5'/></g><ellipse cx='20' cy='25' rx='5' ry='4.6' fill='%23ffffff'/><circle cx='18.4' cy='24.3' r='0.9' fill='%23222'/><circle cx='21.6' cy='24.3' r='0.9' fill='%23222'/><path d='M16 21 q-2.6 -1 -2.7 -3.7 q2.6 0.8 3.7 2.9z' fill='%23eef0f3'/><path d='M24 21 q2.6 -1 2.7 -3.7 q-2.6 0.8 -3.7 2.9z' fill='%23eef0f3'/><g><circle cx='33.5' cy='12' r='4.6' fill='%23f6c544' stroke='%23e0a800' stroke-width='0.8'/><text x='33.5' y='14.6' font-size='6' font-weight='700' fill='%239a6a00' text-anchor='middle'>¥</text></g><rect x='4.5' y='4.5' width='13' height='8.6' rx='4' fill='%23111827'/><text x='11' y='10.7' font-size='6' font-weight='700' fill='%235eead4' text-anchor='middle'>AI</text><path d='M10.4 12.4 l-1.2 3.4 1.9 -0.7 -1 3.4' fill='none' stroke='%23ffd23f' stroke-width='1.3' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="assets/style.css?v=2.8">
</head>
<body>

<header class="topnav" id="topnav"></header>

<div class="page-wrap">
  <div class="page-head">
    <h1>🧮 凑单工具</h1>
    <p>今年双11 淘宝以「官方立减」为主，跨店常见<b>每满 200 减 20</b>（上不封顶，以店铺实际规则为准）。把想买的产品加进来，自动算差额、推荐刚好补差的商品。</p>
  </div>

  <!-- 添加商品 -->
  <div class="ct-card">
    <h3>① 添加你的产品</h3>
    <div class="ct-add">
      <div class="ct-add-row">
        <textarea id="ctPaste" rows="3" placeholder="粘贴淘宝链接或淘口令，一行一个（在商品页点「分享→复制链接」拿到的就是）"></textarea>
        <button class="ct-btn primary" id="ctParseBtn">解析添加</button>
      </div>
      <div class="ct-add-row">
        <input id="ctKw" type="text" placeholder="或者输个关键词搜着加，如：抽纸、数据线">
        <button class="ct-btn" id="ctSearchBtn">搜索添加</button>
      </div>
      <div class="ct-add-row">
        <input id="ctManualName" type="text" placeholder="手动添加：商品名称" class="grow">
        <input id="ctManualPrice" type="number" min="0" step="0.1" placeholder="到手价 ¥">
        <button class="ct-btn" id="ctManualBtn">添加</button>
      </div>
      <div class="ct-add-note">解析、搜索、推荐里的商品，领券购买都走你的专属优惠通道；手动添加的条目只本地参与计算。</div>
    </div>
    <div class="ct-search-result" id="ctSearchResult" style="display:none">
      <div class="ct-sr-head">搜索结果 <span class="ct-sr-close" id="ctSrClose">✕</span></div>
      <div class="ct-sr-list" id="ctSrList"></div>
    </div>
  </div>

  <!-- 已选商品 -->
  <div class="ct-card">
    <h3>② 已选产品 <span class="ct-count" id="ctCount">0 件</span></h3>
    <div class="ct-rows" id="ctRows"></div>
  </div>

  <!-- 满减设置 + 汇总 -->
  <div class="ct-card">
    <h3>③ 满减门槛</h3>
    <div class="ct-rule">
      <div class="field">
        <label>每满（元）</label>
        <input id="ctPer" type="number" value="200" min="1">
      </div>
      <div class="field">
        <label>减（元）</label>
        <input id="ctCut" type="number" value="20" min="0">
      </div>
      <div class="ct-rule-note">淘宝双11 主流玩法：每满 200 减 20，跨店合并，上不封顶</div>
    </div>
    <div class="ct-summary" id="ctSummary"></div>
  </div>

  <!-- 智能补差推荐 -->
  <div class="ct-card">
    <h3>④ 智能补差推荐</h3>
    <div class="ct-add-note" id="ctRecTip">加满产品后，这里按差额推荐刚好补差的商品。</div>
    <div class="ct-rec-list" id="ctRecList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/common.js?v=2.8"></script>
<script src="assets/coutao.js?v=2.8"></script>
</body>
</html>
